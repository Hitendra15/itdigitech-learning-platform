services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: itdigitech
      POSTGRES_USER: itdigitech
      POSTGRES_PASSWORD: itdigitech
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U itdigitech"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  # Isolated code runner for Java / C / C++ in the Code lab. Student code never runs inside Django.
  # First run:  docker compose up -d runner && docker compose exec runner sh -c "true"
  # then install languages with the Piston CLI: https://github.com/engineer-man/piston#cli
  runner:
    image: ghcr.io/engineer-man/piston
    privileged: true
    tmpfs: ["/piston/jobs:exec,uid=1000,gid=1000,mode=711"]
    volumes: ["pistondata:/piston/packages"]

  worker:
    build: ./backend
    command: celery -A config worker -l info -Q critical,default,exec,reports
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on: [backend]

  beat:
    build: ./backend
    command: celery -A config beat -l info
    env_file: ./backend/.env
    volumes: ["./backend:/app"]
    depends_on: [backend]

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes: ["./frontend:/app"]
    ports: ["5173:5173"]
    depends_on: [backend]

volumes:
  pgdata:
  pistondata:
