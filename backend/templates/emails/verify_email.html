{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 14px;font-size:24px;letter-spacing:-.02em;">Confirm your email</h1>
<p style="margin:0 0 12px;font-size:15.5px;line-height:1.65;">Hi {{ name }}, tap the button below to confirm this email address.</p>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:26px 0 8px;"><tr><td style="background:#2f46e6;border-radius:10px;"><a href="{{ verify_url }}" style="display:inline-block;padding:13px 26px;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;">Confirm my email</a></td></tr></table>
<p style="margin:0 0 6px;font-size:13.5px;color:#5b6684;line-height:1.6;">The link works for 3 days. If you did not request this, you can ignore this email.</p>
{% endblock %}
