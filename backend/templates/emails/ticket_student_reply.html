{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 14px;font-size:24px;letter-spacing:-.02em;">{{ student }} replied on {{ reference }}</h1>
<p style="margin:0 0 12px;font-size:15.5px;line-height:1.65;"><strong>{{ subject_line }}</strong></p>
<div style="border-left:3px solid #2f46e6;background:#f4f6fb;padding:14px 18px;border-radius:0 10px 10px 0;margin:16px 0;font-size:15px;line-height:1.65;white-space:pre-wrap;">{{ preview }}</div>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:26px 0 8px;"><tr><td style="background:#2f46e6;border-radius:10px;"><a href="{{ url }}" style="display:inline-block;padding:13px 26px;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;">Open in admin console</a></td></tr></table>
{% endblock %}
