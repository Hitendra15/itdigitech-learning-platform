{% extends "emails/base.html" %}
{% block content %}
<h1 style="margin:0 0 14px;font-size:24px;letter-spacing:-.02em;">{{ title }}</h1>
<p style="margin:0 0 6px;font-size:13.5px;color:#5b6684;line-height:1.6;">Hi {{ name }},</p>
<div style="font-size:15.5px;line-height:1.7;white-space:pre-wrap;">{{ body }}</div>
<table role="presentation" cellspacing="0" cellpadding="0" style="margin:26px 0 8px;"><tr><td style="background:#2f46e6;border-radius:10px;"><a href="{{ frontend_url }}" style="display:inline-block;padding:13px 26px;color:#ffffff;font-weight:700;font-size:15px;text-decoration:none;">Open IT DigiTech</a></td></tr></table>
{% endblock %}
