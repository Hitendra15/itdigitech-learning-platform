<!doctype html>
<html lang="en">

    <meta name="theme-color" content="#f6f7f9" />
    <meta name="description" content="IT DigiTech Learn: video lessons, timed tests and in-app support for college students learning IT skills." />
    <title>IT DigiTech Learn</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232251e0'/%3E%3Cpath d='m12 11-5 5 5 5M20 11l5 5-5 5' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <script>
      // Apply the saved theme before first paint so there is no light flash in dark mode.
      try {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
